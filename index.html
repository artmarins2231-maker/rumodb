.marquee{background:var(--sun);border-block:3px solid var(--deep);overflow:hidden;padding:.7rem 0;transform:rotate(-1deg) scale(1.02)}
.mq-inner{display:flex;width:max-content;animation:mq 30s linear infinite}
.marquee:hover .mq-inner{animation-play-state:paused}
.mq-track{font-family:var(--display);font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text);white-space:nowrap;padding-right:2rem}
.mq-track b{color:var(--orange);margin:0 1rem;font-weight:400}
@keyframes mq{to{transform:translateX(-50%)}}
.resultados{max-width:1180px;margin:0 auto;padding:80px 24px 40px}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:.6rem}
.sec-head h2{font-family:var(--display);font-size:clamp(1.9rem,3.6vw,2.9rem);text-transform:uppercase;color:var(--text);line-height:1}
.res-sub{font-family:var(--mono);font-size:.75rem;color:var(--muted);margin-bottom:2rem}
.res-sub b{color:var(--orange)}
.stamp{font-family:var(--display);color:var(--orange);border:3px solid var(--orange);border-radius:10px;padding:.35rem .8rem;font-size:.95rem;letter-spacing:.04em;text-transform:uppercase;transform:rotate(-6deg) scale(0);opacity:0;mix-blend-mode:multiply}
.stamp.show{animation:stampIn .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stampIn{0%{transform:rotate(10deg) scale(2.4);opacity:0}60%{transform:rotate(-8deg) scale(.94);opacity:1}100%{transform:rotate(-6deg) scale(1);opacity:1}}
.loader{padding:2.5rem 0;text-align:center}
.loader-track{position:relative;height:2px;max-width:420px;margin:0 auto 1rem;background:repeating-linear-gradient(90deg,var(--blue) 0 8px,transparent 8px 16px)}
.loader-plane{position:absolute;top:-14px;left:0;font-size:1.4rem;animation:fly 1.1s ease-in-out infinite}
@keyframes fly{0%{left:0;transform:rotate(0)}50%{transform:rotate(6deg) translateY(-6px)}100%{left:calc(100% - 24px);transform:rotate(0)}}
.loader p{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.empty{border:2px dashed var(--deep);border-radius:var(--r);background:rgba(255,255,255,.75);padding:3rem 2rem;text-align:center;max-width:560px;margin:0 auto}
.empty .empty-ico{font-size:2.6rem;display:inline-block;animation:bob 3s ease-in-out infinite}
.empty h3{font-family:var(--display);text-transform:uppercase;margin:.8rem 0 .4rem;color:var(--text)}
.empty p{color:#4a5560;font-size:.95rem;max-width:26rem;margin:0 auto}
.empty.quente{border-color:var(--orange);background:#F7EDE7}
.quase-titulo{font-family:var(--mono);font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);margin:2.4rem 0 1rem;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.6rem;margin-top:1.4rem}
.card{position:relative;background:var(--card);border:1.5px solid var(--linha);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sombra);transition:transform .25s,box-shadow .25s;animation:cardIn .5s cubic-bezier(.2,.9,.3,1.1) both;animation-delay:calc(var(--i,0)*70ms)}
.card:hover{transform:translateY(-4px);box-shadow:0 26px 50px -14px rgba(11,28,40,.4)}
@keyframes cardIn{from{opacity:0;transform:translateY(26px) rotate(1deg)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-6px) rotate(-.5deg);box-shadow:12px 14px 0 rgba(19,27,32,.85)}
.card.pulse{animation:pulseCard 1.5s ease}
@keyframes pulseCard{0%,100%{box-shadow:var(--sombra)}40%{box-shadow:0 0 0 8px var(--sun),var(--sombra)}}
.card-num{position:absolute;top:10px;left:12px;z-index:2;font-family:var(--mono);font-size:.66rem;background:var(--deep);color:var(--sun);padding:.15rem .5rem;border-radius:6px}
.card-band{position:relative;padding:1.9rem 1.2rem 1rem;border-bottom:2px solid var(--deep);background-image:repeating-linear-gradient(-45deg,rgba(31,42,48,.06) 0 3px,transparent 3px 14px)}
.card-flag{font-size:2.6rem;line-height:1;filter:drop-shadow(2px 3px 0 rgba(31,42,48,.25))}
.card-region{position:absolute;bottom:10px;left:12px;font-family:var(--mono);font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;background:var(--deep);color:#fff;padding:.2rem .55rem;border-radius:6px}
.favbtn{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:99px;border:2px solid var(--deep);background:var(--card);font-size:1.05rem;display:flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
.favbtn:hover{transform:scale(1.12) rotate(-6deg)}
.favbtn.on{background:var(--orange);animation:heartPop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes heartPop{0%{transform:scale(.5)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.card-body{padding:1.1rem 1.2rem 1.2rem;display:flex;flex-direction:column;flex:1}
.card-city{font-family:var(--display);font-size:1.55rem;text-transform:uppercase;color:var(--text);line-height:1.05}
.card-country{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;color:var(--muted);margin:.2rem 0 .55rem}
.card-desc{font-size:.85rem;color:#3c4650;margin-bottom:.7rem}
.card-tags{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.9rem}
.tag{font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;border:1.5px solid var(--linha);padding:.15rem .5rem;border-radius:99px;color:#4a5560;background:var(--fundo)}
.breakdown{border-top:2px dashed var(--linha);padding-top:.7rem;margin-bottom:.8rem}
.bd-row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:.74rem;padding:.18rem 0;color:#3c4650;gap:.5rem}
.bd-row span:last-child{font-weight:700;white-space:nowrap}
.bd-row.hotel-line{color:var(--blue)}
.bd-row.comp-line{color:var(--orange)}
.total-line{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem;margin-bottom:.5rem}
.total-label{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.total-val{font-family:var(--display);font-size:1.7rem;color:var(--text)}
.sobra{font-family:var(--mono);font-size:.66rem;padding:.2rem .55rem;border-radius:99px;border:1.5px solid;white-space:nowrap}
.sobra.ok{color:var(--ok);border-color:var(--ok);background:#E3EFE9}
.sobra.quente{color:var(--danger);border-color:var(--danger);background:#F4E3E3}
.card-note{font-family:var(--mono);font-size:.62rem;color:#7b858d;margin-bottom:.9rem}
.card-actions{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.card.quase{border-style:dashed;box-shadow:none;background:transparent}
.card.quase:hover{transform:none;box-shadow:none}
.como{background:var(--navy);color:#E8ECEE;padding:90px 24px 100px;position:relative;overflow:hidden;border-top:3px solid var(--deep)}
.como::before{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1.5px,transparent 1.5px);background-size:26px 26px;pointer-events:none}
.como-in{max-width:1080px;margin:0 auto;position:relative}
.como .sec-kicker{font-family:var(--mono);font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--sun)}
.como h2{font-family:var(--display);font-size:clamp(1.9rem,3.6vw,2.9rem);text-transform:uppercase;margin:.4rem 0 3rem;color:#fff}
.passos{display:flex;flex-direction:column;position:relative}
.passos::before{content:'';position:absolute;left:39px;top:20px;bottom:20px;width:0;border-left:2px dashed rgba(217,164,65,.5)}
.passo{display:flex;gap:1.6rem;padding:1.3rem 0;position:relative;align-items:flex-start}
.passo-num{flex:0 0 80px;height:80px;border-radius:99px;background:var(--sun);color:var(--deep);border:3px solid var(--deep);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:1.5rem;box-shadow:5px 5px 0 rgba(12,18,24,.5);position:relative;z-index:1;transition:transform .25s}
.passo:hover .passo-num{transform:rotate(-8deg) scale(1.06)}
.passo h3{font-family:var(--display);text-transform:uppercase;font-size:1.15rem;color:#fff;margin-bottom:.3rem}
.passo p{color:#C4CDD2;max-width:34rem;font-size:.95rem}
.passo .passo-ico{margin-left:auto;font-size:1.8rem;align-self:center;opacity:.9;transition:transform .25s}
.passo:hover .passo-ico{transform:translateX(6px) rotate(8deg)}
.stats{margin-top:3.2rem;display:flex;flex-wrap:wrap;gap:.8rem 2.6rem;border:2px dashed rgba(217,164,65,.45);border-radius:var(--r);padding:1.2rem 1.6rem;font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;color:var(--sun)}
.stats b{color:#fff}
.exp-hero{background:linear-gradient(160deg,var(--sky2),var(--ice) 60%,var(--fundo));border-bottom:3px solid var(--deep);padding:70px 24px 60px;position:relative;overflow:hidden}
.exp-hero .exp-in{max-width:1180px;margin:0 auto}
.exp-hero h1{font-family:var(--display);font-size:clamp(2rem,4.4vw,3.4rem);text-transform:uppercase;color:var(--text)}
.exp-hero h1 span{color:var(--orange)}
.exp-hero p{margin-top:.8rem;max-width:36rem;color:#3c4650;font-size:1.05rem}
.exp-sec{max-width:1180px;margin:0 auto;padding:60px 24px 10px}
.exp-sec>h2{font-family:var(--display);font-size:clamp(1.5rem,3vw,2.2rem);text-transform:uppercase;color:var(--text);margin-bottom:.4rem}
.exp-sec>.sub{font-family:var(--mono);font-size:.72rem;color:var(--muted);margin-bottom:1.6rem}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.3rem}
.gal-card{background:var(--card);border:2px solid var(--deep);border-radius:var(--r);overflow:hidden;box-shadow:var(--sombra-sm);transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column}
.gal-card:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:8px 10px 0 rgba(19,27,32,.85)}
.gal-band{padding:1.2rem 1rem .8rem;font-size:2.2rem;border-bottom:2px solid var(--deep);background-image:repeating-linear-gradient(-45deg,rgba(31,42,48,.06) 0 3px,transparent 3px 14px)}
.gal-body{padding:.9rem 1rem 1rem;display:flex;flex-direction:column;flex:1}
.gal-body h3{font-family:var(--display);font-size:1.1rem;text-transform:uppercase;color:var(--text)}
.gal-body .g-meta{font-family:var(--mono);font-size:.64rem;color:var(--muted);margin:.2rem 0 .5rem}
.gal-body .g-from{font-family:var(--mono);font-size:.72rem;color:var(--blue);font-weight:700;margin-bottom:.7rem}
.gal-body .btn{margin-top:auto}
.exp-duo{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;align-items:start}
.panel{background:var(--card);border:2px solid var(--deep);border-radius:var(--r);box-shadow:var(--sombra-sm);padding:1.4rem}
.panel h3{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;color:var(--text);margin-bottom:.9rem}
.conv-row{display:grid;grid-template-columns:1.2fr .8fr;gap:.8rem;margin-bottom:.9rem}
.conv-out{background:var(--ice);border:2px dashed var(--blue);border-radius:12px;padding:1rem;text-align:center}
.conv-out .co-v{font-family:var(--display);font-size:1.6rem;color:var(--navy)}
.conv-out .co-l{font-family:var(--mono);font-size:.64rem;color:var(--muted);letter-spacing:.1em}
.conv-note{font-family:var(--mono);font-size:.62rem;color:var(--muted);margin-top:.7rem}
.chk-bar{height:14px;border:2px solid var(--deep);border-radius:99px;background:var(--fundo);overflow:hidden;margin-bottom:1rem}
.chk-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--ok));width:0;transition:width .4s cubic-bezier(.2,.9,.3,1)}
.chk-item{display:flex;align-items:center;gap:.6rem;padding:.5rem .6rem;border:1.5px dashed var(--linha);border-radius:10px;margin-bottom:.5rem;cursor:pointer;transition:all .15s;background:var(--fundo);font-size:.88rem}
.chk-item:hover{border-color:var(--blue);transform:translateX(3px)}
.chk-item input{accent-color:var(--ok);width:16px;height:16px}
.chk-item.done{background:#E3EFE9;border-color:var(--ok);text-decoration:line-through;color:var(--muted)}
.fun-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.3rem;padding-bottom:20px}
.fun-card{background:var(--deep);color:#E4E9EB;border:2px solid var(--abyss);border-radius:var(--r);padding:1.3rem;box-shadow:var(--sombra-sm);transition:transform .2s}
.fun-card:hover{transform:translateY(-4px) rotate(.6deg)}
.fun-card .f-ico{font-size:2rem;display:block;margin-bottom:.6rem}
.fun-card p{font-size:.9rem;line-height:1.55}
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.3rem;padding-bottom:70px}
.comp-card{background:var(--card);border:2px solid var(--deep);border-radius:var(--r);box-shadow:var(--sombra-sm);padding:1rem;transition:transform .2s,box-shadow .2s;display:flex;flex-direction:column;gap:.5rem}
.comp-card:hover{transform:translateY(-5px) rotate(-.5deg);box-shadow:8px 10px 0 rgba(19,27,32,.85)}
.comp-top{display:flex;align-items:center;gap:.7rem}
.comp-logo{width:46px;height:46px;border-radius:12px;border:2px solid var(--deep);display:flex;align-items:center;justify-content:center;font-family:var(--display);color:#fff;font-size:.95rem;box-shadow:3px 3px 0 rgba(19,27,32,.6);flex:0 0 46px}
.comp-name{font-weight:800}
.comp-type{font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;padding:.12rem .5rem;border-radius:99px;border:1.5px solid var(--blue);color:var(--blue);background:var(--ice)}
.comp-meta{font-family:var(--mono);font-size:.66rem;color:var(--muted)}
.comp-desc{font-size:.8rem;color:#3c4650}
.comp-row{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;border:2px solid var(--deep);border-radius:12px;background:#fff;padding:.8rem 1rem;margin-bottom:.8rem}
.comp-row.usada{background:#F6EFDF;border-color:var(--orange)}
.best-badge{font-family:var(--mono);font-size:.6rem;background:var(--ok);color:#fff;border-radius:99px;padding:.12rem .5rem}

.lab-hero{background:linear-gradient(140deg,var(--deep),var(--navy) 55%,var(--blue));border-bottom:3px solid var(--deep);padding:80px 24px 70px;position:relative;overflow:hidden}

.lab-hero .exp-in{max-width:1180px;margin:0 auto;position:relative}
.lab-hero h1{font-family:var(--display);font-size:clamp(2.2rem,4.6vw,3.6rem);text-transform:uppercase;color:#fff}
.lab-hero h1 span{color:var(--sun)}
.lab-hero p{margin-top:.8rem;max-width:38rem;color:#C4CDD2;font-size:1.05rem}
.lab-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;max-width:1180px;margin:0 auto;padding:60px 24px 70px}
.lab-card{background:var(--card);border:2px solid var(--deep);border-radius:var(--r);box-shadow:var(--sombra);padding:1.5rem;transition:transform .2s}
.lab-card:hover{transform:translateY(-4px)}
.lab-card h3{font-family:var(--display);font-size:1.2rem;text-transform:uppercase;color:var(--text);margin-bottom:.3rem}
.lab-card .sub{font-family:var(--mono);font-size:.66rem;color:var(--muted);margin-bottom:1.1rem}
.wx-out{margin-top:1rem;border:2px dashed var(--blue);border-radius:12px;background:var(--ice);padding:1.1rem;display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.wx-temp{font-family:var(--display);font-size:2.6rem;color:var(--navy)}
.wx-info{font-family:var(--mono);font-size:.72rem;color:#3c4650;display:flex;flex-direction:column;gap:.25rem}
.wx-emoji{font-size:2.6rem}
.quiz-opt{display:block;width:100%;text-align:left;margin-bottom:.55rem;border:2px solid var(--deep);border-radius:10px;background:#fff;padding:.65rem .8rem;font-size:.88rem;transition:all .15s}
.quiz-opt:hover{background:var(--sun);transform:translateX(4px)}
.quiz-res{border:2px solid var(--ok);border-radius:12px;background:#E3EFE9;padding:1rem;margin-top:.8rem}
.quiz-res h4{font-family:var(--display);text-transform:uppercase;color:var(--text);margin-bottom:.4rem}
.split-out{margin-top:1rem;text-align:center;border:2px dashed var(--ok);border-radius:12px;background:#E3EFE9;padding:1rem}
.split-out .so-v{font-family:var(--display);font-size:2rem;color:var(--text)}
.split-out .so-l{font-family:var(--mono);font-size:.66rem;color:var(--muted)}
.radar-feed{display:flex;flex-direction:column;gap:.7rem}
.deal{display:flex;align-items:center;gap:.8rem;border:2px solid var(--deep);border-radius:12px;background:#fff;padding:.7rem .9rem;animation:cardIn .4s both}
.deal .d-off{font-family:var(--display);color:#fff;background:var(--danger);border-radius:10px;padding:.35rem .5rem;font-size:.95rem}
.deal .d-info{flex:1}
.deal .d-city{font-weight:800}
.deal .d-meta{font-family:var(--mono);font-size:.64rem;color:var(--muted)}
.deal .d-time{font-family:var(--mono);font-size:.66rem;color:var(--danger);font-weight:700}
footer{background:var(--abyss);color:#9AA6AD;padding:56px 24px 40px;border-top:3px solid var(--deep)}
.foot-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;gap:2rem;justify-content:space-between;align-items:flex-start}
.foot-logo{font-family:var(--display);font-size:2rem;color:#fff}.foot-logo span{color:var(--sun)}
.foot-tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;margin-top:.4rem;text-transform:uppercase;color:var(--sky2)}
.foot-note{max-width:26rem;font-size:.8rem;line-height:1.6}
.foot-db{display:flex;flex-direction:column;gap:.6rem;align-items:flex-start}

.foot-bottom{max-width:1180px;margin:2.4rem auto 0;padding-top:1.2rem;border-top:1px solid rgba(255,255,255,.12);font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;display:flex;justify-content:space-between;flex-wrap:wrap;gap:.6rem;align-items:center}
.foot-link{color:inherit;opacity:.75;text-decoration:none;transition:opacity .2s}
.foot-link:hover{opacity:1;text-decoration:underline}
.overlay{position:fixed;inset:0;background:rgba(12,18,24,.62);z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.open{opacity:1;pointer-events:auto}

.modal-card{background:var(--card);border:2px solid var(--deep);border-radius:18px;box-shadow:var(--sombra);width:min(420px,100%);padding:2rem;position:relative;margin:auto;transform:translateY(20px) scale(.97);transition:transform .3s cubic-bezier(.2,.9,.3,1.2)}

.modal-close{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:99px;border:2px solid var(--deep);background:var(--sun);font-size:1rem;font-weight:800;transition:transform .15s}

.modal-card h3{font-family:var(--display);font-size:1.5rem;text-transform:uppercase;color:var(--text);margin-bottom:.3rem}
.modal-card .sub{font-size:.85rem;color:var(--muted);margin-bottom:1.4rem}
.form-err{color:var(--danger);font-family:var(--mono);font-size:.72rem;min-height:1.1em;margin-bottom:.6rem}
.modal-switch{margin-top:1.2rem;font-size:.82rem;text-align:center;color:var(--muted)}

.modal-wide{width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column;padding:0;overflow:hidden}

.hotels-head .hh-top{display:flex;align-items:center;gap:.9rem;flex-wrap:wrap}
.hotels-head .hh-flag{font-size:2.2rem}
.hotels-head h3{margin:0}
.hh-meta{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.06em;margin-top:.2rem}
.teto-bar{margin-top:.9rem;background:#fff;border:1.5px solid var(--linha);border-radius:10px;padding:.6rem .9rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.teto-bar .tb-l{font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.teto-bar .tb-v{font-family:var(--display);font-size:1.15rem;color:var(--navy)}

.hr-total{font-family:var(--mono);font-size:.66rem;color:var(--muted)}

.fab{position:fixed;right:22px;bottom:22px;z-index:85;width:62px;height:62px;border-radius:99px;background:linear-gradient(140deg,var(--sun),var(--orange));border:2px solid var(--deep);box-shadow:var(--sombra-sm);font-size:1.6rem;display:flex;align-items:center;justify-content:center;transition:transform .2s}

.chat-msgs{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.7rem;background:repeating-linear-gradient(0deg,transparent 0 26px,rgba(62,108,142,.06) 26px 27px)}
.msg{max-width:88%;padding:.6rem .8rem;border-radius:12px;font-size:.84rem;line-height:1.5;animation:msgIn .3s ease;white-space:pre-line}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-end;background:var(--sun);border:2px solid var(--deep);border-bottom-right-radius:4px;white-space:normal}
.msg.ai{align-self:flex-start;background:var(--fundo);border:2px solid var(--linha);border-bottom-left-radius:4px}

.msg.ai .ai-btns{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.typing{display:inline-flex;gap:4px;padding:.2rem 0}

.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.chat-chips{display:flex;flex-wrap:wrap;gap:.4rem;padding:.6rem 1rem 0}
.chat-chip{font-family:var(--mono);font-size:.62rem;background:#fff;border:1.5px solid var(--deep);border-radius:99px;padding:.3rem .7rem;transition:all .15s}
.chat-chip:hover{background:var(--sun);transform:translateY(-2px)}
.chat-in{display:flex;gap:.5rem;padding:.8rem 1rem;border-top:2px dashed var(--linha)}
.chat-in input{flex:1;border:2px solid var(--deep);border-radius:10px;padding:.55rem .7rem;font-size:.85rem}
.chat-in input:focus{outline:none;box-shadow:3px 3px 0 var(--sun)}
.chat-in button{padding:.55rem .9rem}
.toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:.5rem;align-items:center}
.toast{background:var(--deep);color:var(--sun);font-family:var(--mono);font-size:.75rem;padding:.7rem 1.2rem;border-radius:99px;border:2px solid var(--sun);box-shadow:4px 4px 0 rgba(0,0,0,.35);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:none}}
.toast.out{opacity:0;transform:translateY(8px);transition:all .3s}
.reveal{opacity:0;transform:translateY(30px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.9,.3,1);transition-delay:calc(var(--i,0)*.12s)}
.reveal.in{opacity:1;transform:none}
@media(max-width:960px){
  .hero-in{grid-template-columns:1fr;gap:2.5rem}
  .ticket{justify-self:center;transform:rotate(0)}
  .passos::before{left:29px}
  .passo-num{flex-basis:60px;height:60px;font-size:1.15rem}
  .passo .passo-ico{display:none}
  .exp-duo,.lab-grid{grid-template-columns:1fr}
}
@media(max-width:720px){

  .hr-right{align-items:flex-start;text-align:left}
  .f-check{margin-left:0}
  .card-actions{grid-template-columns:1fr}
  .chat{right:10px;bottom:90px}
  .fab{right:10px;bottom:18px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .loader-plane,.hero-bg{display:none}
}

function transportFor(d,origemName){
  const o=origemName?ORIGEM_BY_NAME[origemName]:null;
  if(!o||d.country!=='Brasil')return{cost:d.flight,key:'bd_flight'};
  if(o.uf===d.uf)return{cost:Math.max(120,Math.round((d.bus||300)*0.45)),key:'bd_car'};
  if(REG_UF[o.uf]===REG_UF[d.uf])return{cost:d.bus||300,key:'bd_bus'};
  return{cost:d.flight,key:'bd_flight'};
}

async function detectAPI(){const cands=[location.origin+'/api','http://localhost:3000/api'];for(const c of cands){try{const r=await fetch(c+'/ping');if(r.ok){API_URL=c;return true}}catch(e){}}return false}
async function apiCall(path,opts){
  if(!API_URL)throw new Error('offline');
  const r=await fetch(API_URL+path,opts);
  let data=null;try{data=await r.json()}catch(e){}
  if(!r.ok)throw Object.assign(new Error((data&&data.error)||'erro'),{status:r.status,data});
  return data;
}
async function dbInit(){
  const ok=await detectAPI();
  DB.mode=ok?'server':'offline';
  if(!ok)return;
  const token=localStorage.getItem('traja_token');
  if(!token)return;
  try{
    const j=await apiCall('/me',{headers:{Authorization:'Bearer '+token}});
    state.token=token;state.session=j.user.email;USERS[j.user.email]=j.user;
  }catch(e){
    localStorage.removeItem('traja_token');localStorage.removeItem('traja_session');state.token=null;state.session=null;
  }
}
const findUser=email=>USERS[email];
function getFavsFor(email){try{return JSON.parse(localStorage.getItem('traja_favs_'+email)||'[]')}catch(e){return[]}}
const state={budget:0,days:0,region:'any',origem:'',destino:'',chosen:{},chosenComp:{},session:localStorage.getItem('traja_session')||null,token:localStorage.getItem('traja_token')||null,lastQuery:null};
try{state.chosen=JSON.parse(localStorage.getItem('traja_chosen')||'{}')}catch(e){state.chosen={}}
try{state.chosenComp=JSON.parse(localStorage.getItem('traja_comp')||'{}')}catch(e){state.chosenComp={}}
const getFavs=()=>state.session?getFavsFor(state.session):[];
const setFavs=a=>localStorage.setItem('traja_favs_'+state.session,JSON.stringify(a));
function tripParts(d){
  const tr=transportFor(d,state.origem);
  const cid=state.chosenComp[d.id];
  let comp=cid?getComp(cid):null;
  if(comp&&!compsFor(d,tr).some(x=>x.id===comp.id))comp=null;
  const tcost=comp?Math.round(tr.cost*comp.fator):tr.cost;
  return{tr,comp,tcost};
}
const qOrigem=$('#qOrigem'),qDestino=$('#qDestino');
function buildOrigemSelect(){
  const prev=qOrigem.value;const grupos={N:[],NE:[],CO:[],SE:[],S:[]};
  ORIGENS.forEach(([n,uf])=>grupos[REG_UF[uf]].push([n,uf]));
  let html=`<option value="">${t('city_ph')}</option>`;
  [['N','grp_n'],['NE','grp_ne'],['CO','grp_co'],['SE','grp_se'],['S','grp_s']].forEach(([g,key])=>{html+=`<optgroup label="${esc(t(key))}">`+grupos[g].map(([n,uf])=>`<option value="${esc(n)}">${esc(n)} – ${uf}</option>`).join('')+'</optgroup>'});
  qOrigem.innerHTML=html;
  if(prev){if([...qOrigem.options].some(o=>o.value===prev))qOrigem.value=prev;else{const o=document.createElement('option');o.value=prev;o.textContent=prev;qOrigem.appendChild(o);qOrigem.value=prev}}
}
function buildDestinoSelect(){
  const prev=qDestino.value;const ordem=['Brasil','EUA','Portugal','Canadá','Chile','Argentina','Paraguai','Uruguai','México'];
  let html=`<option value="">${t('dest_any')}</option>`;
  ordem.forEach(r=>{html+=`<optgroup label="${esc(t('reg_'+r))}">`;DESTS.filter(d=>d.region===r).forEach(d=>{html+=`<option value="${d.id}">${esc(cityName(d))}</option>`});html+='</optgroup>'});
  qDestino.innerHTML=html;
  if(prev&&destById(prev))qDestino.value=prev;
}

const form=$('#ticket'),inpB=$('#qOrca'),inpD=$('#qDias'),inpR=$('#qRegiao');

function runSearch(){
  const budget=parseInt(inpB.value.replace(/\D/g,''))||0;
  const days=Math.min(30,Math.max(1,parseInt(inpD.value)||0));
  if(budget<100){toast('💸 '+t('f_budget')+'?');inpB.focus();return}
  if(!days){toast('📅 '+t('f_days')+'?');inpD.focus();return}
  state.budget=budget;state.days=days;state.region=inpR.value;state.origem=qOrigem.value;state.destino=qDestino.value;
  state.lastQuery={budget,days};showLoading();setTimeout(computeAndRender,reduced?60:950);
}
function showLoading(){$('#resultStamp').classList.remove('show');$('#resSub').textContent='…';$('#resultsWrap').innerHTML=`<div class="loader"><div class="loader-track"><span class="loader-plane">✈</span></div><p>${t('load1')} ${DESTS.length} ${t('load2')}</p></div>`}
function computeAndRender(){
  let list=DESTS.filter(d=>state.destino?d.id===state.destino:(state.region==='any'||d.region===state.region))
    .map(d=>{
      const {tr,comp,tcost}=tripParts(d);
      const chosen=state.chosen[d.id]?d.hot.find(h=>h.name===state.chosen[d.id]):null;
      const hotel=chosen||defaultHotel(d);
      return{d,hotel,tr,comp,tcost,total:tripTotal(d,state.days,hotel,tcost)};
    }).sort((a,b)=>a.total-b.total);
  const fits=list.filter(x=>x.total<=state.budget);
  const almost=list.filter(x=>x.total>state.budget);
  renderResults(fits,state.destino?almost:almost.slice(0,3));
}
function renderResults(fits,almost){
  const wrap=$('#resultsWrap');const stamp=$('#resultStamp');
  const from=state.origem?' · '+t('from_note',{c:state.origem}):'';
  $('#resSub').innerHTML=`<b>${fits.length}</b> ${t(fits.length===1?'dest1':'destN')} <b>${brl(state.budget)}</b> ${t('rs_for')} <b>${state.days} ${t(state.days>1?'dayN':'day1')}</b>${from} · ${t('rs_order')}`;
  stamp.textContent=(fits.length+' '+t(fits.length===1?'stamp1':'stampN')).toUpperCase();
  stamp.classList.remove('show');void stamp.offsetWidth;stamp.classList.add('show');
  if(!fits.length){
    wrap.innerHTML=`<div class="empty quente"><span class="empty-ico">🛫</span><h3>${t('nfit_t')}</h3><p>${t('nfit_p')}</p></div>${almost.length?`<p class="quase-titulo">${t('almost_t')}</p><div class="grid">${almost.map((x,i)=>cardHTML(x,i,true)).join('')}</div>`:''}`;
    bindCards();return;
  }
  wrap.innerHTML=`<div class="grid">${fits.map((x,i)=>cardHTML(x,i,false)).join('')}</div>`;
  bindCards();
  $$('#resultsWrap [data-count]').forEach(el=>countUp(el,+el.dataset.count));
}
function cardHTML(x,i,quase){

  return `
  <article class="card ${quase?'quase':''}" data-id="${d.id}" style="--i:${i}">

    </div>

      <h3 class="card-city">${esc(cityName(d))}</h3>
      <p class="card-country">${esc(t('reg_'+d.country))} · ${state.days} ${t(state.days>1?'dayN':'day1')}${state.origem?' · '+t('from_note',{c:state.origem}):''}</p>
      <p class="card-desc">${esc(d.desc[LANG]||d.desc.pt)}</p>
      <div class="card-tags">${d.tags.map(g=>`<span class="tag">${esc(tagLabel(g))}</span>`).join('')}</div>
      <div class="breakdown">
        <div class="bd-row ${comp?'comp-line':''}"><span>${esc(trLabel)}</span><span>${brl(tcost)}</span></div>
        <div class="bd-row hotel-line"><span>🏨 ${esc(hotel.name)} · ${state.days} ${nightW}</span><span>${brl(hotel.p*state.days)}</span></div>
        <div class="bd-row"><span>${t('bd_daily')} (${state.days}×)</span><span>${brl(d.food*state.days)}</span></div>
      </div>
      <div class="total-line">
        <div><span class="total-label">${t('total_label')}</span><div class="total-val" data-count="${total}">${brl(total)}</div></div>
        ${quase?`<span class="sobra quente">${t('falta')} ${brl(falta)}</span>`:`<span class="sobra ${sobra>=0?'ok':'quente'}">${sobra>=0?t('sobra')+' '+brl(sobra):t('tight')}</span>`}
      </div>

      </div>
    </div>
  </article>`;
}

let hotelCtx=null;
function openHotels(destId){
  const d=destById(destId);if(!d)return;
  const {budget,days}=state;const {tcost}=tripParts(d);
  const maxNight=Math.floor((budget-tcost)/days-d.food);

  const nightW=t(days>1?'nightN':'night1');
  $('#hotelsHead').innerHTML=`<div class="hh-top"><span class="hh-flag">${REGION_EMOJI[d.region]||'📍'}</span><div><h3>${t('hm_t',{c:cityName(d)})}</h3><p class="hh-meta">${t('hm_meta',{n:days,nw:nightW,b:brl(budget)})}${state.origem?' · '+t('from_note',{c:state.origem}):''}</p></div></div>

function renderHotelRows(){
  const {d,tcost,maxNight,tier,fitOnly}=hotelCtx;const chosenName=state.chosen[d.id];
  let list=[...d.hot].sort((a,b)=>a.p-b.p);

  if(fitOnly)list=list.filter(h=>h.p<=maxNight);
  $('#hotelsCount').textContent=`${list.length} ${t('hm_suf',{n:d.hot.length})}`;
  if(!list.length){$('#hotelsList').innerHTML=`<div class="hotels-none">😕 ${t('hm_none')}<br><small>${t('hm_none2')}</small></div>`;return}

    return `<div class="hotel-row ${cabe?'':'fora'} ${chosenName===h.name?'escolhido':''}">
      <div><div class="hr-name">${esc(h.name)}<span class="hr-tier t${h.t}">${t('tier'+h.t)}</span></div><div class="hr-bairro">📍 ${esc(h.b)}</div><div class="hr-amen">${amen}</div></div>
      <div class="hr-right"><span class="hr-rating">★ ${h.r.toFixed(1)}</span><div class="hr-price">${brl(h.p)}<small> ${t('per_night')}</small></div><div class="hr-total">${t('ht_total',{n:state.days,v:brl(h.p*state.days)})}</div>

  }).join('');

}

$('#signupForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const nome=$('#suNome').value.trim(),email=$('#suEmail').value.trim().toLowerCase();
  const senha=$('#suSenha').value,cidade=$('#suCidade').value;const err=$('#signupErr');
  if(nome.length<2)return err.textContent=t('err_name');
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return err.textContent=t('err_email');
  if(!cidade)return err.textContent=t('err_city');
  if(senha.length<6)return err.textContent=t('err_pass');
  if(!API_URL){err.textContent=t('err_offline');return}
  const btn=e.target.querySelector('[type=submit]');if(btn)btn.disabled=true;
  try{
    const j=await apiCall('/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,email,senha,cidade})});
    USERS[email]=j.user;state.token=j.token;localStorage.setItem('traja_token',j.token);
    err.textContent='';e.target.reset();loginLocal(email);
    toast(t('toast_created',{n:nome.split(' ')[0]}));
  }catch(ex){
    err.textContent=ex.status===409?t('err_exists'):(ex.status===429?t('err_rate'):t('err_creds'));
  }finally{if(btn)btn.disabled=false}
});
$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const email=$('#liEmail').value.trim().toLowerCase(),senha=$('#liSenha').value;const err=$('#loginErr');
  if(!API_URL){err.textContent=t('err_offline');return}
  const btn=e.target.querySelector('[type=submit]');if(btn)btn.disabled=true;
  try{
    const j=await apiCall('/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,senha})});
    USERS[email]=j.user;state.token=j.token;localStorage.setItem('traja_token',j.token);
    err.textContent='';e.target.reset();loginLocal(email);
    toast(t('toast_welcome',{n:j.user.nome.split(' ')[0]}));
  }catch(ex){
    if(ex.status===429){err.textContent=t('err_rate')}else{err.textContent=t('err_creds');shakeLogin()}
  }finally{if(btn)btn.disabled=false}

function loginLocal(email){
  state.session=email;localStorage.setItem('traja_session',email);
  if(state.token)localStorage.setItem('traja_token',state.token);

const KW={praia:['praia','mar ','beach','playa','litoral','costa','orla'],serra:['serra','frio','montanha','cold','sierra','mountain'],neve:['neve','snow','nieve','esqui','ski'],deserto:['deserto','desert','atacama'],cultura:['cultura','museu','museum','hist','arte','culture'],gastronomia:['comida','gastronomia','food','comer','culin','taco','vinho','wine'],festa:['festa','balada','night','party','fiesta','agito'],'família':['família','filho','criança','family','kids','niños','familia'],natureza:['natureza','trilha','nature','cachoeira','trail'],aventura:['aventura','adventure','radical','buggy','mergulho'],compras:['compras','shopping','outlet','compra'],urbano:['cidade grande','urbano','metrópole','metropolis','city'],parques:['disney','universal','parque temático','theme park'],vinho:['vinho','wine','vinícola','bodega'],economia:['barato','econômico','pouca grana','cheap','económico','pouco dinheiro']};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MESES_EN=['january','february','march','april','may','june','july','august','september','october','november','december'];
const MESES_ES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function parseMonth(low){
  for(let i=0;i<12;i++){if(low.includes(MESES[i])||low.includes(MESES_EN[i])||low.includes(MESES_ES[i]))return i}
  return null;
}
function monthName(m){const loc=LANG==='pt'?'pt-BR':LANG==='es'?'es-ES':'en-US';const s=new Date(2025,m,1).toLocaleString(loc,{month:'long'});return s.charAt(0).toUpperCase()+s.slice(1)}
function goodSeason(d,m){
  if(m===null)return null;
  const sul=LATLON[d.id]&&LATLON[d.id][0]<0;
  if(d.tags.includes('neve'))return sul?(m>=5&&m<=8):(m===11||m<=2);
  if(d.tags.includes('praia')||d.tags.includes('verão'))return sul?(m>=8||m<=3):(m>=4&&m<=9);
  if(d.tags.includes('serra'))return sul?(m>=3&&m<=8):true;
  if(d.tags.includes('deserto'))return(m>=2&&m<=4)||(m>=8&&m<=10);
  return true;
}
const _ai={ctx:null,shown:[],voice:false};
function aiParse(text){
  const low=' '+text.toLowerCase()+' ';let budget=null;
  // "3 mil", "2,5 mil", "3k", "3.5k" — tudo antes de tentar casar valores em R$
  const mil=low.match(/(\d+(?:[.,]\d+)?)\s*(mil|k)\b/);if(mil)budget=Math.round(parseFloat(mil[1].replace(',','.'))*1000);
  // "R$ 2.500,00", "R$2500", "R$ 2,500.00" (formato en-US ocasional)
  if(!budget){const m=low.match(/r\$\s*([\d.,]+)/);if(m){
    let raw=m[1];
    if(/,\d{2}$/.test(raw))raw=raw.replace(/\./g,'').replace(',','.'); // 2.500,00 -> 2500.00
    else raw=raw.replace(/,/g,''); // 2,500 -> 2500
    const v=parseFloat(raw);if(!isNaN(v))budget=Math.round(v);
  }}
  if(!budget){const m=low.match(/\b(\d{1,3}(?:\.\d{3})+)\b/);if(m)budget=parseInt(m[1].replace(/\./g,''))} // "3.500" sem R$
  if(!budget){const m=low.match(/\b(\d{3,7})\b/);if(m)budget=parseInt(m[1])}
  let days=null;const dm=low.match(/(\d{1,2})\s*(dias|d[ií]as|days|noites|nights)/);if(dm)days=parseInt(dm[1]);
  if(!days){if(/fim de semana|weekend|fin de semana/.test(low))days=3;
    else{const sm=low.match(/(\d{1,2})?\s*semanas?|weeks?|semanas?/);if(/semana|week/.test(low))days=(sm&&sm[1]?parseInt(sm[1]):1)*7;}}
  let people=null;const pm=low.match(/(\d{1,2})\s*(pessoas|people|personas)/)||low.match(/pra\s+(\d{1,2})\b/)||low.match(/for\s+(\d{1,2})\b/)||low.match(/para\s+(\d{1,2})\b/);if(pm)people=parseInt(pm[1]);
  if(!people&&/(a dois|nós dois|casal|us two|the two of us|en pareja)/.test(low))people=2;
  const month=parseMonth(low);
  const likes=new Set();for(const tag in KW){if(KW[tag].some(k=>low.includes(k)))likes.add(tag)}
  return{budget,days,people,month,likes:[...likes]};
}
function aiScore(d,likes,budget,days,people){
  const hotel=defaultHotel(d);const {tcost}=tripParts(d);const total=tripTotal(d,days,hotel,tcost);
  let score=0;d.tags.forEach(tg=>{if(likes.includes(tg))score+=3});
  const group=total*(people||1);
  if(budget){if(group<=budget)score+=2+(budget-group)/budget*2;else score-=5}
  if(likes.includes('economia'))score+=(6000-total)/1200;
  return{d,total,score};
}
function buildRoteiro(d,days){
  const pool=d.tags.filter(tg=>ACT[tg]);if(!pool.length)pool.push('urbano','gastronomia');
  const acts=['chegada'];const mid=Math.max(0,days-2);
  for(let i=0;i<mid;i++)acts.push(pool[i%pool.length]);
  if(days>1)acts.push('volta');
  return acts.map((a,i)=>`<b>${t('ai_day',{n:i+1})}:</b> ${esc(ACT[a][LANG]||ACT[a].pt)}`).join('<br>');
}

/* AURORA "de verdade": quando o server.js tem ANTHROPIC_API_KEY configurada,
   a gente manda a mensagem + o contexto (orçamento/dias/destinos já
   calculados aqui no site) pro servidor, que chama a Anthropic e devolve uma
   resposta natural — sempre baseada nos dados reais do site, nunca

async function tryAiSmart(text){
  if(!API_URL)return false;
  const p=aiParse(text);
  const ctx=_ai.ctx||{};
  const budget=p.budget||ctx.budget||null;
  const days=p.days||ctx.days||5;
  const people=p.people||ctx.people||null;
  const month=p.month!==null?p.month:(ctx.month!==undefined?ctx.month:null);
  const likes=p.likes.length?p.likes:(ctx.likes||[]);
  let scored=[];
  if(budget){
    scored=DESTS.map(d=>aiScore(d,likes,budget,days,people)).filter(x=>x.total*(people||1)<=budget).sort((a,b)=>b.score-a.score||a.total-b.total).slice(0,3);
    if(scored.length){_ai.ctx={budget,days,people,month,likes};scored.forEach(x=>_ai.shown.push(x.d.id))}
  }
  const context={budget,days,people,month:month!==null?monthName(month):null,likes:likes.map(tagLabel),top:scored.map(x=>({city:cityName(x.d),total:x.total,tags:x.d.tags.map(tagLabel)}))};
  _ai.history=(_ai.history||[]).slice(-6);
  let j=null;
  try{
    const r=await fetch(API_URL+'/ai/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,lang:LANG,context,history:_ai.history})});
    j=await r.json().catch(()=>null);
    if(!r.ok||!j||!j.ok||!j.reply)return false;
  }catch(e){return false}
  _ai.history.push({role:'user',content:text});
  _ai.history.push({role:'assistant',content:j.reply});
  let html=esc(j.reply).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
  if(scored.length){
    const first=scored[0];
    html+=`<span class="ai-btns"><button class="btn mini primary" data-ai-apply="1">${t('ai_cta')}</button><button class="btn mini sky" data-ai-hotels="${first.d.id}">${t('ai_follow_hotels')}</button><button class="btn mini yellow" data-ai-comps="${first.d.id}">${t('ai_follow_comps')}</button><button class="btn mini" data-ai-follow="mais barato">${t('ai_follow_cheaper')}</button></span>`;
  }
  streamMsg(html);
  return true;
}
async function sendAI(text,fromBtn){
  const v=(text||'').trim();if(!v)return;
  if(!fromBtn){addMsg(esc(v),'user')}
  $('#chatInput').value='';
  const ty=addMsg('<span class="typing"><span></span><span></span><span></span></span>','ai');
  const low=' '+v.toLowerCase()+' ';
  if(isFaqQuery(low)||!API_URL){
    setTimeout(()=>{ty.remove();aiRespondRule(v)},reduced?60:700+Math.random()*500);
    return;
  }
  const ok=await tryAiSmart(v).catch(()=>false);

}
function aiRespondRule(text){
  const low=' '+text.toLowerCase()+' ';
  if(/banco|senha|dados|database|login/.test(low)&&/como|funciona|o que|what|how|dónde|donde/.test(low)||/banco de dados|database/.test(low)){streamMsg(t('ai_faq_bank'));return}
  if(/companhia|aérea|aerea|ônibus|onibus|carrier|airline|compañía/.test(low)){streamMsg(t('ai_faq_comp'));return}
  if(/hotel|hosped|pousada|stay|aloj/.test(low)&&!/quero|pra|for|tenho/.test(low)){streamMsg(t('ai_faq_hotel'));return}
  if(/lab|clima|weather|quiz|radar|rachad|split/.test(low)){streamMsg(t('ai_faq_lab'));return}
  if(/como funciona|how (does|it)|cómo funciona/.test(low)){streamMsg(t('ai_faq_how'));return}
  const p=aiParse(text);
  const ctx=_ai.ctx||{};
  const budget=p.budget||ctx.budget||null;
  const days=p.days||ctx.days||5;
  const people=p.people||ctx.people||null;
  const month=p.month!==null?p.month:(ctx.month!==undefined?ctx.month:null);
  const likes=p.likes.length?p.likes:(ctx.likes||[]);
  if(/mais barato|cheaper|más barato/.test(low)){
    const all=DESTS.map(d=>aiScore(d,likes,budget||999999,days,people)).sort((a,b)=>a.total-b.total);
    const next=all.filter(x=>!_ai.shown.includes(x.d.id)).slice(0,3);
    if(!next.length){streamMsg(t('ai_none'));return}
    next.forEach(x=>_ai.shown.push(x.d.id));
    _ai.ctx={budget,days,people,month,likes};
    let html='<b>'+t('ai_picks')+'</b>';
    next.forEach((x,i)=>{html+=`<span class="pick">${i+1}. <b>${esc(cityName(x.d))}</b> · ${brl(x.total)} · ${t('ai_fit',{v:brl((budget||x.total)-x.total)})}</span>`});
    streamMsg(html);return;
  }
  if(!budget){streamMsg(t('ai_ask_budget'));return}
  _ai.ctx={budget,days,people,month,likes};
  const scored=DESTS.map(d=>aiScore(d,likes,budget,days,people)).filter(x=>x.total*(people||1)<=budget).sort((a,b)=>b.score-a.score||a.total-b.total).slice(0,3);
  if(!scored.length){streamMsg(t('ai_none'));return}
  scored.forEach(x=>_ai.shown.push(x.d.id));
  const tagsTxt=likes.length?likes.map(tagLabel).join(', '):'🎲';
  let html=t('ai_understood',{b:brl(budget),d:days,p:people?t('ai_people',{p:people}):'',tags:tagsTxt});
  if(month!==null){const top=scored[0].d;const ok=goodSeason(top,month);html+='<br>'+(ok?t('ai_month_ok',{m:monthName(month),c:cityName(top)}):t('ai_month_bad',{m:monthName(month),c:cityName(top),e:epocaDe(top)}))}
  if(people)html+='<br>'+t('ai_group',{p:people,v:brl(scored[0].total*people)});
  html+='<br><br><b>'+t('ai_picks')+'</b>';
  scored.forEach((x,i)=>{html+=`<span class="pick">${i+1}. <b>${esc(cityName(x.d))}</b> · ${brl(x.total)}<br><small>🏷 ${x.d.tags.map(tagLabel).map(esc).join(', ')} · ${t('ai_fit',{v:brl(budget-x.total)})}</small></span>`});
  html+='<br><br>'+t('ai_roteiro',{c:cityName(scored[0].d)})+'<br>'+buildRoteiro(scored[0].d,days);
  html+=`<span class="ai-btns"><button class="btn mini primary" data-ai-apply="1">${t('ai_cta')}</button><button class="btn mini sky" data-ai-hotels="${scored[0].d.id}">${t('ai_follow_hotels')}</button><button class="btn mini yellow" data-ai-comps="${scored[0].d.id}">${t('ai_follow_comps')}</button><button class="btn mini" data-ai-follow="mais barato">${t('ai_follow_cheaper')}</button><button class="btn mini" data-ai-follow="mais opções">${t('ai_follow_more')}</button></span>`;
  streamMsg(html);
}

    let best=PROFILES[0],bestV=-1;
    PROFILES.forEach(p=>{const v=p.tags.reduce((a,tg)=>a+(_quiz.scores[tg]||0),0);if(v>bestV){bestV=v;best=p}});
    const recs=DESTS.map(d=>({d,v:d.tags.reduce((a,tg)=>a+(_quiz.scores[tg]||0),0)})).sort((a,b)=>b.v-a.v).slice(0,3);
    box.innerHTML=`<div class="quiz-res"><h4>${t('quiz_res')} ${esc(best.n[LANG]||best.n.pt)}</h4>
      ${recs.map(r=>`<div class="comp-meta">✈ ${esc(cityName(r.d))} · ${esc(t('reg_'+r.d.country))}</div>`).join('')}
      <div style="display:flex;gap:.5rem;margin-top:.8rem;flex-wrap:wrap">
        <button class="btn mini primary" id="quizApply">${t('quiz_apply')}</button>
        <button class="btn mini" id="quizAgain">${t('quiz_again')}</button>
      </div></div>`;
    $('#quizAgain').addEventListener('click',()=>{_quiz={i:0,scores:{}};renderQuiz()});
    $('#quizApply').addEventListener('click',()=>{
      const top=recs[0].d;
      qDestino.value=top.id;state.destino=top.id;location.hash='#/';
      updateTicketRoute();toast('🧬 '+cityName(top)+'!');
      setTimeout(()=>$('#buscar').scrollIntoView({behavior:reduced?'auto':'smooth'}),60);
    });
  }
}
function splitCalc(){
  const tot=parseInt($('#splitTotal').value.replace(/\D/g,''))||0;
  const ppl=Math.max(1,parseInt($('#splitPpl').value)||1);
  $('#splitEach').textContent=brl(Math.round(tot/ppl));
  $('#splitTip').textContent=t('split_tip',{v:brl(Math.round(tot/ppl*1.1))});
}
$('#splitTotal').addEventListener('input',e=>{const v=e.target.value.replace(/\D/g,'').slice(0,9);e.target.value=v?Number(v).toLocaleString('pt-BR'):'';splitCalc()});
$('#splitPpl').addEventListener('input',splitCalc);
let _radar={deals:[],tick:null};
function radarPush(){
  const d=DESTS[Math.floor(Math.random()*DESTS.length)];
  const disc=10+Math.floor(Math.random()*31);
  const {tcost}=tripParts(d);
  const base=tripTotal(d,5,defaultHotel(d),tcost);
  _radar.deals.unshift({id:d.id,city:cityName(d),flag:REGION_EMOJI[d.region],disc,price:Math.round(base*(1-disc/100)),left:600});
  _radar.deals=_radar.deals.slice(0,4);
  radarRender();
}
function radarRender(){
  $('#radarFeed').innerHTML=_radar.deals.map(dl=>{
    const mm=String(Math.floor(dl.left/60)).padStart(2,'0'),ss=String(dl.left%60).padStart(2,'0');
    return `<div class="deal"><span class="d-off">-${dl.disc}%</span>
      <div class="d-info"><div class="d-city">${dl.flag} ${esc(dl.city)}</div><div class="d-meta">${brl(dl.price)} · ${t('radar_left',{t:mm+':'+ss})}</div></div>
      <button class="btn mini primary" data-deal="${dl.id}" data-price="${dl.price}">${t('radar_grab')}</button></div>`;
  }).join('');
  $$('#radarFeed [data-deal]').forEach(b=>b.addEventListener('click',()=>{
    qDestino.value=b.dataset.deal;state.destino=b.dataset.deal;
    inpB.value=String(b.dataset.price).replace(/\B(?=(\d{3})+(?!\d))/g,'.');inpD.value=5;
    location.hash='#/';updateTicketRoute();runSearch();
    setTimeout(()=>$('#resultado').scrollIntoView({behavior:reduced?'auto':'smooth'}),300);
  }));
}
function renderLab(){
  buildWxDest();renderQuiz();splitCalc();
  if(!_radar.deals.length){radarPush();radarPush()}else radarRender();
  if(!_radar.tick){
    _radar.tick=setInterval(()=>{
      if($('#page-lab').hidden)return;
      _radar.deals.forEach(dl=>dl.left--);
      _radar.deals=_radar.deals.filter(dl=>dl.left>0);
      if(Math.random()<0.12)radarPush();else radarRender();
    },1000);
  }
}
$$('.chip-ex').forEach(c=>c.addEventListener('click',()=>{inpB.value=Number(c.dataset.b).toLocaleString('pt-BR');inpD.value=c.dataset.d;inpR.value='any';runSearch();$('#resultado').scrollIntoView({behavior:reduced?'auto':'smooth'})}));
addEventListener('scroll',()=>$('#hdr').classList.toggle('scrolled',scrollY>10),{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
$$('.reveal').forEach(el=>io.observe(el));
try{
  $('#langSel').value=LANG;applyI18n();buildOrigemSelect();buildDestinoSelect();buildWxDest();buildMarquee();updateTicketRoute();updateAuthUI();route();
  $('#ano').textContent=new Date().getFullYear();
}catch(e){console.warn('init parcial:',e)}
(async()=>{try{await dbInit();updateAuthUI()}catch(e){console.warn('banco:',e)}})();

// ---------- PWA: registrar service worker e botão "Instalar app" ----------
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{})});
}
(function(){
  let deferredPrompt=null;
  const btn=document.getElementById('btnInstall');
  if(!btn)return;
  const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
  function refresh(){ btn.hidden = isStandalone() || !(deferredPrompt||isIOS()); }
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;refresh();});
  window.addEventListener('appinstalled',()=>{deferredPrompt=null;btn.hidden=true;});
  btn.addEventListener('click',async()=>{
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt=null;
      btn.hidden=true;
    }else if(isIOS()){
      alert(t('install_ios'));
    }else{
      alert(t('install_fallback'));
    }
  });
  refresh();
})();
</script>
